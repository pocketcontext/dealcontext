name: Container image
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# On main, runs wait for each other, so `latest` always ends at the newest commit. Elsewhere a new
# push cancels the run of the previous one.
concurrency:
  group: image-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  IMAGE: ghcr.io/pocketcontext/dealcontext

jobs:
  # Every branch and pull request: build for the runner's architecture and run the image.
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install packaged CLI for container checks
        run: |
          python3 -m venv "$RUNNER_TEMP/context-client"
          "$RUNNER_TEMP/context-client/bin/pip" install .
          echo "$RUNNER_TEMP/context-client/bin" >> "$GITHUB_PATH"
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build the image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          tags: dealcontext:ci
          build-args: REVISION=${{ github.sha }}
          provenance: false
          # The scope of the amd64 publication build below, so that build starts from this cache.
          cache-from: type=gha,scope=amd
          cache-to: type=gha,mode=max,scope=amd
      - name: Verify maintenance using the built server
        run: |
          python3 tests/maintenance_entrypoint.py
          container=$(docker create dealcontext:ci)
          trap 'docker rm "$container" >/dev/null' EXIT
          docker cp "$container:/usr/local/bin/pocketcontext" "$RUNNER_TEMP/maintenance-server"
          python3 tests/maintenance.py --binary "$RUNNER_TEMP/maintenance-server"
          python3 tests/object_storage.py --binary "$RUNNER_TEMP/maintenance-server"
      - name: Show the image
        run: |
          docker image inspect dealcontext:ci --format 'id={{.Id}} digests={{json .RepoDigests}}'
          docker run --rm --entrypoint sh dealcontext:ci -c 'set -eu; litestream version; pocketcontext --version; cat /app/POCKETCONTEXT_VERSION; find /app /usr/local/bin -type f | sort; test ! -e /app/pb_hooks/.gitkeep'
      - name: Startup errors for missing configuration
        run: python3 docker/smoke.py config --image dealcontext:ci
      - name: Smoke test
        run: python3 docker/smoke.py smoke --image dealcontext:ci
      - name: Restore drill
        run: python3 docker/smoke.py restore --image dealcontext:ci
      - name: Protected S3 files and frozen fresh-volume recovery
        run: python3 docker/object_storage_smoke.py --image dealcontext:ci --minio-image dealcontext-minio-fixture:9e49d5e-7394ce0

  # Main only, from here on (a push, or a manual run on main). The four Python tests gate the publication.
  tests:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    uses: ./.github/workflows/test.yml
    permissions:
      contents: read

  # Each architecture is built on its own runner and pushed by digest, under no tag, so that two runs
  # close together cannot mix their halves in one manifest.
  build:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs:
      - check
      - tests
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm
            platform: linux/arm64
            runner: ubuntu-24.04-arm
          - arch: amd
            platform: linux/amd64
            runner: ubuntu-24.04
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: ${{ matrix.platform }}
          build-args: REVISION=${{ github.sha }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          provenance: false
          cache-from: type=gha,scope=${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.arch }}
      - name: Export digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          test -n "$DIGEST"
          mkdir -p /tmp/digests
          touch "/tmp/digests/${DIGEST#sha256:}"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: digests-${{ matrix.arch }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  # One imagetools call creates both tags from the digests of this run.
  manifest:
    needs:
      - build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: /tmp/digests
          pattern: digests-*
          merge-multiple: true
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Create and push the manifest list
        working-directory: /tmp/digests
        run: |
          set -- *
          echo "digests of this run: $*"
          test "$#" -eq 2
          sources=""
          for digest in "$@"; do
            sources="$sources $IMAGE@sha256:$digest"
          done
          # shellcheck disable=SC2086 # one argument per digest
          docker buildx imagetools create \
            --tag "$IMAGE:latest" \
            --tag "$IMAGE:sha-${GITHUB_SHA::7}" \
            $sources
      - name: Show what was published
        run: docker buildx imagetools inspect "$IMAGE:latest"

  # The ping of the Colors ONCE package (github-deploy.md): no command is sent. The deploy key's
  # forced command on the server updates every host this repository serves. Skipped until the
  # repository variable COLORS_PROFILE names the Colors profile, which is also the name of the
  # GitHub environment that `once create` fills.
  deploy:
    if: vars.COLORS_PROFILE != ''
    needs:
      - manifest
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions: {}
    environment:
      name: ${{ vars.COLORS_PROFILE }}
    # Serialize rather than cancel: interrupting a deploy midway is worse than making the next one wait.
    concurrency:
      group: deploy-${{ vars.COLORS_PROFILE }}
      cancel-in-progress: false
    steps:
      - name: Deploy via SSH
        env:
          # Only the key is a secret. The address and user are variables, so the logs stay readable.
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SERVER_IP: ${{ vars.SERVER_IP }}
          SERVER_USER: ${{ vars.SERVER_USER }}
          SSH_KNOWN_HOSTS: ${{ vars.SSH_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh
          # shellcheck disable=SC2046
          eval $(ssh-agent -s)
          echo "$SSH_PRIVATE_KEY" | tr -d '\r' | ssh-add -

          # Pinned by ONCE at provisioning time, not scanned here. Fail closed.
          if [ -z "$SSH_KNOWN_HOSTS" ]; then
            echo "SSH_KNOWN_HOSTS is unset - run 'once create' to publish it" >&2
            exit 1
          fi
          printf '%s\n' "$SSH_KNOWN_HOSTS" >> ~/.ssh/known_hosts

          # A ping, not a command. Connect to SERVER_IP: the pinned host key is keyed on the address.
          # The exit status is the deploy result for every host this key owns.
          ssh -T -o StrictHostKeyChecking=yes "$SERVER_USER@$SERVER_IP" < /dev/null
      - name: Verify public health
        run: |
          # /up executes a database query, so HTTP 200 also checks database availability.
          curl --fail --silent --show-error \
            --connect-timeout 10 --max-time 20 \
            --retry 12 --retry-delay 5 --retry-max-time 180 --retry-all-errors \
            https://crm.pocketcontext.com/up
